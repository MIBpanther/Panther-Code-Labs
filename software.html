<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panther Code Labs - Software</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 0;
        }

        header nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 4%;
        }

        header .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 600;
        }

        header nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

            header nav ul li a {
                color: #ccc;
                text-decoration: none;
                font-family: 'Roboto', sans-serif;
                font-size: 16px;
                transition: color 0.3s;
            }

                header nav ul li a:hover {
                    color: #00ff88;
                }

        main {
            padding: 40px 4%;
        }

        #software-details {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 10px;
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            color: #00ff88;
            margin-bottom: 10px;
        }

        p {
            color: #aaa;
            margin-bottom: 30px;
        }

        h3 {
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 15px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

            ul li {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 15px;
                background-color: #292929;
                border-radius: 5px;
                margin-bottom: 10px;
            }

        .software-name {
            font-family: 'Roboto', sans-serif;
            font-size: 16px;
            color: #fff;
        }

        .download-btn {
            display: inline-block;
            padding: 8px 16px;
            background-color: #00ff88;
            color: #000;
            text-decoration: none;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }

            .download-btn:hover {
                background-color: #00cc66;
            }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <header>
        <nav class="animate__animated animate__fadeInDown">
            <div class="logo">Panther Code Labs</div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="software.html">Software</a></li>
                <li><a href="electronics.html">Electronics</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="software-details" class="card animate__animated animate__fadeInUp">
            <h2>Available Software</h2>
            <p>Download the latest tools and software utilities for your projects.</p>
            <h3>Software List:</h3>
            <ul>
                <li>
                    <span class="software-name">Rufus 4.15</span>
                    <a href="https://drive.google.com/file/d/1A7O6EM4wlJ8s1vsuv78UZF9jbgeVkYnM/view?usp=sharing" class="download-btn" target="_blank" rel="noopener noreferrer">Download</a>
                </li>
            </ul>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Alex. All rights reserved.</p>
    </footer>
</body>
</html>
